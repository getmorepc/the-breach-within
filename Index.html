<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Breach Within</title>
  <style>
    body {
      margin: 0;
      background: #000;
      font-family: monospace;
      overflow: hidden;
      text-align: center;
    }
    #gameContainer {
      display: flex;
      justify-content: center;
      align-items: center;
      height: calc(100vh - 40px);
    }

    #gameCanvas {
      width: 90vmin;
      height: 90vmin;
      max-width: 768px;
      max-height: 768px;
      border: 4px solid #444;
      image-rendering: pixelated;
    }
    #score {
      color: #00FF00;
      font-size: 20px;
      margin: 10px;
    }
  </style>
</head>
<body>
  <audio id="gameOverMusic" src="game_over.mp3"></audio>
  <audio id="introMusic" src="intro.mp3"></audio>
  <div id="titleScreen" style="position: absolute; width: 100%; height: 100%; background: #000; color: #00FF00; display: flex; flex-direction: column; justify-content: center; align-items: center; font-size: 32px; font-family: monospace; z-index: 10;">
    <div style="margin-bottom: 20px;">The Breach Within</div>
    <button id="startButton" style="padding: 10px 20px; font-size: 20px; cursor: pointer;">Start</button>
    <div id="highScoreDisplay" style="margin-top: 20px; font-size: 18px;">High Score: ---</div>
  </div>
  <div id="introScreen" style="position: absolute; width: 100%; height: 100%; background: #000; color: #00FF00; display: none; flex-direction: column; justify-content: center; align-items: center; font-size: 24px; font-family: monospace; z-index: 15;">
    <div style="margin: 20px;">Every day your kingdom is under attack…</div>
    <div style="margin: 20px;">Slash the hackers and earn points before they breach the castle!</div>
    <button id="beginButton" style="padding: 10px 20px; font-size: 20px; cursor: pointer;">Begin</button>
  </div>
  <div id="gameOverScreen" style="position: absolute; width: 100%; height: 100%; background: #000; color: red; display: none; flex-direction: column; justify-content: center; align-items: center; font-size: 48px; font-family: monospace; z-index: 20;">
    <div style="margin-bottom: 20px;">💥 GAME OVER 💥</div>
    <img src="game_over.png" alt="Castle Breach" style="width: 200px; image-rendering: pixelated;" />
  </div>
  <div id="score">Score: 0</div>
  <div id="gameContainer">
    <canvas id="gameCanvas" width="768" height="768"></canvas>
  </div>
  <audio id="bgMusic" src="My_oldest_enemy.mp3" loop></audio>
  <audio id="slashSound" src="slash.mp3"></audio>
  <audio id="missedSound" src="missed.mp3"></audio>
  <img id="slashEffect" src="slash.png" style="position:absolute; display:none; width:100px; height:100px; pointer-events:none;" />
  <script>
  const music = document.getElementById('bgMusic');
  const slashSound = document.getElementById('slashSound');
  const missedSound = document.getElementById('missedSound');
  const gameOverMusic = document.getElementById('gameOverMusic');
  gameOverMusic.volume = 0.1;
  const introMusic = document.getElementById('introMusic');
  slashSound.volume = 0.1;
  missedSound.volume = 0.3;
  const slashEffect = document.getElementById('slashEffect');

  let gameStarted = false;
  let difficultyLevel = 1;
  let misses = 0;
  let highScore = 0;
  let highScoreInitials = '---';
  let highScores = [];
  const phishingEmails = [
    { text: "Subject: Action required - Reset your Microsoft 365 password immediately.\n\nClick here to avoid account suspension.", isPhishing: true },
    { text: "Subject: Monthly Staff Meeting Reminder\n\nJoin us Monday at 9 AM in the main conference room. Coffee provided!", isPhishing: false },
    { text: "Subject: Unpaid Invoice - URGENT\n\nOpen attached .zip file and wire payment to the updated account details inside.", isPhishing: true }
  ];

  function loadHighScores() {
    const stored = localStorage.getItem('theBreachHighScores');
    if (stored) {
      highScores = JSON.parse(stored);
    }
  }

  function saveHighScores() {
    localStorage.setItem('theBreachHighScores', JSON.stringify(highScores));
  }

  function updateHighScoreDisplay() {
    const display = highScores.map((s, i) => `${i + 1}. ${s.initials} - ${s.score}`).join('<br>');
    document.getElementById('highScoreDisplay').innerHTML = `High Scores:<br>${display}`;
  }

  document.getElementById('startButton').addEventListener('click', () => {
    document.getElementById('titleScreen').style.display = 'none';
    document.getElementById('introScreen').style.display = 'flex';
    introMusic.volume = 0.2;
    introMusic.currentTime = 0;
    introMusic.play().catch(() => {
      console.warn("Intro music play failed. User interaction may be required.");
    });
  });

  document.getElementById('beginButton').addEventListener('click', () => {
    document.getElementById('introScreen').style.display = 'none';
    gameStarted = true;
    introMusic.pause();
    introMusic.currentTime = 0;
    gameOverMusic.pause();
    gameOverMusic.currentTime = 0;
    music.volume = 0.1;
    music.currentTime = 0;
    music.play().catch(() => {
      console.warn("User interaction required to start audio.");
    });
    getRandomPosition();
    draw();
    clearInterval(respawnInterval);
    respawnInterval = setInterval(() => {
      getRandomPosition();
      draw();
    }, 5000);
  });

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    const background = new Image();
    background.src = 'image.png';

    const hacker = new Image();
    hacker.src = 'hacker.png';

    let hackerX = 100;
    let hackerY = 100;
    let score = 0;
    let moveInterval = null;
    let respawnInterval = null;

    function getRandomPosition() {
      const maxX = canvas.width - 128;
      const maxY = canvas.height - 128;
      hackerX = Math.random() * maxX;
      hackerY = Math.random() * maxY;
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(background, 0, 0, canvas.width, canvas.height);
      ctx.drawImage(hacker, hackerX, hackerY, 128, 128);
    }

    function startMovingHacker() {
      if (moveInterval) return;
      moveInterval = setInterval(() => {
        const movementRange = 50 * difficultyLevel;
        hackerX += (Math.random() - 0.5) * movementRange;
        hackerY += (Math.random() - 0.5) * movementRange;

        const maxX = canvas.width - 128;
        const maxY = canvas.height - 128;
        hackerX = Math.max(0, Math.min(maxX, hackerX));
        hackerY = Math.max(0, Math.min(maxY, hackerY));

        draw();
      }, 500 / difficultyLevel);
    }

    canvas.addEventListener('click', function (e) {
      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;
      const mouseX = (e.clientX - rect.left) * scaleX;
      const mouseY = (e.clientY - rect.top) * scaleY;

      if (
        mouseX >= hackerX && mouseX <= hackerX + 128 &&
        mouseY >= hackerY && mouseY <= hackerY + 128
      ) {
        const points = 1 + Math.floor(difficultyLevel / 2);
        score += points;
        document.getElementById('score').innerText = 'Score: ' + score;

        slashSound.currentTime = 0;
        slashSound.play();

        slashEffect.style.left = `${canvas.offsetLeft + hackerX + 64 - 50}px`;
        slashEffect.style.top = `${canvas.offsetTop + hackerY + 64 - 50}px`;
        slashEffect.style.display = 'block';

        setTimeout(() => {
          slashEffect.style.display = 'none';
        }, 300);

        setTimeout(() => {
          getRandomPosition();
          draw();
        }, 300);

        if (score >= 5) {
          startMovingHacker();
        }
      } else {
        missedSound.currentTime = 0;
        missedSound.play();
        misses++;
        if (misses >= 3) {
          endGame();
        }
      }
    });

    let imagesLoaded = 0;

    function checkAllLoaded() {
      imagesLoaded++;
      if (imagesLoaded === 2) {
        getRandomPosition();
        draw();
        respawnInterval = setInterval(() => {
          getRandomPosition();
          draw();
        }, 5000); // respawn every 5 seconds
      }
    }

    function stopRespawning() {
      clearInterval(respawnInterval);
    }

    function endGame() {
      stopRespawning();
      clearInterval(moveInterval);
      moveInterval = null;
      gameStarted = false;

      music.pause();
      music.currentTime = 0;
      introMusic.pause();
      introMusic.currentTime = 0;
      document.getElementById('gameOverScreen').style.display = 'flex';
      gameOverMusic.play();
      setTimeout(() => {
        document.getElementById('gameOverScreen').style.display = 'none';
        document.getElementById('titleScreen').style.display = 'flex';
        gameOverMusic.pause();
        gameOverMusic.currentTime = 0;
        introMusic.play();
      }, 6000);

      if (score > 0) {
        const initials = prompt("Enter your initials:");
        if (initials) {
          highScores.push({ initials: initials.slice(0, 3).toUpperCase(), score });
          highScores.sort((a, b) => b.score - a.score);
          highScores = highScores.slice(0, 10);
          saveHighScores();
        }
      }
      updateHighScoreDisplay();
      score = 0;
      difficultyLevel = 1;
      misses = 0;
      document.getElementById('score').innerText = 'Score: 0';
    }

    loadHighScores();
    updateHighScoreDisplay();
    background.onload = checkAllLoaded;
    hacker.onload = checkAllLoaded;
  </script>
</body>
</html>
